---
name: Lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  addon-config:
    name: Add-on config lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Lint add-on configuration
        uses: frenck/action-addon-linter@v2
        with:
          path: "./grafana_alloy"

  executable-bits:
    name: Executable bit check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # s6-overlay execs a service's `run` (and, for oneshots, `up`) script
      # directly. If either is committed without the executable bit, the
      # service silently fails to start inside the container - a mistake
      # that's easy to make locally (an editor or `git add` on some
      # platforms can save scripts as mode 644) and easy to miss until the
      # add-on is actually deployed. Catch it here instead.
      - name: Verify s6 run/up scripts are executable in git
        shell: bash
        run: |
          set -euo pipefail

          # git ls-files -s prints "<mode> <object> <stage>\t<path>" per
          # entry. Find entries whose path ends in /run or /up but whose
          # mode is 100644 (not executable). The trailing `|| true` is
          # required because grep exits 1 when it finds nothing, which
          # would otherwise be (mis)treated as this step failing.
          offenders="$(git ls-files -s grafana_alloy/rootfs | grep -P '^100644\s+\S+\s+\d+\t\S*/(run|up)$' || true)"

          if [[ -n "${offenders}" ]]; then
            echo "::error::One or more s6-overlay run/up scripts are committed without the executable bit (mode 100644). s6-overlay will refuse to start the affected service(s)."
            while IFS=$'\t' read -r _meta path; do
              [[ -n "${path}" ]] || continue
              echo "::error file=${path}::${path} is mode 100644 (not executable). Fix with: chmod +x ${path} && git update-index --chmod=+x ${path}"
            done <<< "${offenders}"
            exit 1
          fi

          echo "All s6 run/up scripts under grafana_alloy/rootfs are executable (mode 100755)."

  build:
    name: Build amd64 image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # No push, no signing (so no id-token) and no registry login: the image
      # is only loaded into the local Docker engine as ghcr.io/...:ci.
      # container-registry-password is a required input but unused here.
      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: amd64
          image: ghcr.io/metril/ha-grafana-alloy
          context: grafana_alloy
          version: 0.0.0-ci
          image-tags: ci
          push: "false"
          load: "true"
          cosign: "false"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

      # Verifies the base image, the Alloy binary and the dlopen'd libsystemd
      # on every PR; release.yml only builds after merge, so without this a
      # broken base-image change would first surface on main.
      - name: Smoke test image
        run: |
          docker run --rm --entrypoint "" ghcr.io/metril/ha-grafana-alloy:ci bash -euo pipefail -c '
            . /etc/os-release; echo "Base: ${PRETTY_NAME}"
            alloy --version
            ldconfig -p | grep libsystemd.so.0
            curl --version | head -1
            test -x /command/with-contenv && test -d /usr/lib/bashio && echo "s6-overlay + bashio present"
            test -x /etc/s6-overlay/s6-rc.d/init-alloy/run && test -x /etc/s6-overlay/s6-rc.d/alloy/run
            bash -n /etc/s6-overlay/s6-rc.d/init-alloy/run && bash -n /etc/s6-overlay/s6-rc.d/alloy/run
          '
