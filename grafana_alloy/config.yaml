---
name: "Grafana Alloy"
version: "1.0.2"
slug: "grafana_alloy"
description: "Ship the Home Assistant system journal to Grafana Loki"
url: "https://github.com/metril/ha-grafana-alloy"
image: "ghcr.io/metril/ha-grafana-alloy"

arch:
  - amd64
  - aarch64

# 'stage' is intentionally absent: it defaults to stable, and the add-on linter
# rejects any key written out as its own default value.

# s6-overlay v3 requires init: false, otherwise the container refuses to start.
init: false

# Start before Home Assistant Core so Core's own startup logs are captured.
startup: services

# Maps the host's systemd journal read-only into the container.
journald: true

map:
  # Exposed as /config inside the container. Holds an optional hand-written
  # config.alloy referenced by the custom_config_path option.
  - addon_config:rw

# Unpublished by default. The Alloy UI has no authentication and shows the
# Loki URL and username (the password is redacted), so it is not put on the
# network unless asked for. Assign a port in the Network tab to reach it.
# Alloy still binds 0.0.0.0 inside the container so publishing works when
# enabled; the healthcheck uses the container's own loopback either way.
ports:
  12345/tcp: null
ports_description:
  12345/tcp: "Alloy web UI - unauthenticated (leave empty to keep internal-only)"

# Health is reported through the Dockerfile's HEALTHCHECK directive, which
# Supervisor consumes natively. The 'watchdog' key is obsolete.
webui: "http://[HOST]:[PORT:12345]/"

options:
  loki_url: null
  loki_tls_skip_verify: false
  journal_max_age: "24h"
  log_level: "info"

schema:
  loki_url: url
  loki_username: "str?"
  loki_password: "password?"
  loki_tenant_id: "str?"
  loki_ca_cert: "str?"
  loki_server_name: "str?"
  loki_tls_skip_verify: bool
  instance_label: "str?"
  journal_max_age: str
  journal_matches: "str?"
  log_level: "list(debug|info|warn|error)"
  additional_config: "str?"
  custom_config_path: "str?"
